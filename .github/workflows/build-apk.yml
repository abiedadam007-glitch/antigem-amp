name: Build Debug APK

on:
  push:
    branches:
      - main
      - standalone
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch termux-am submodule
        run: git submodule update --init --depth 1 termux-am || true

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Parse version
        id: version
        run: |
          VERSION_NAME=$(python3 scripts/release_version.py name || echo "2.0.0-amp")
          echo "version=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION_NAME}" >> $GITHUB_OUTPUT

      - name: Build Debug APK
        run: |
          chmod +x gradlew scripts/build_all_apks.sh
          ./scripts/build_all_apks.sh

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntiGem-Debug-APK
          path: output/*.apk

      - name: Release APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/standalone'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "AntiGem AMP ${{ steps.version.outputs.tag }}"
          body: |
            ### AntiGem AMP - DeepSeek Harness & Arabic/English Integration

            **Features in this build:**
            - **DeepSeek Harness (`dsh`) Agent**: Full integration with ACP protocol, DeepSeek V3, DeepSeek R1, and DeepSeek Coder.
            - **Package Rename**: `ai.antigem` → `com.amp.antigem`.
            - **Bilingual Interface**: Arabic (RTL) and English (LTR) with in-app language switcher.
            - **Professional Marketplace UI**: Browse and install skills & plugins with categories (Popular, New & Noteworthy) and auth flow.
            - **Integrated Go Bridge**: `agy_ide_bridge` with full `/api/harness/` support.
          prerelease: true
          files: output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
